<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spam Invaders — Leaderboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0e1a3a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
const C = document.getElementById('g');
const X = C.getContext('2d');
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  C.width = W;
  C.height = H;
}
resize();
window.addEventListener('resize', resize);

let leaderboard = JSON.parse(localStorage.getItem('spamInvadersLeaderboard') || '[]');

window.addEventListener('storage', e => {
  if (e.key === 'spamInvadersLeaderboard') {
    leaderboard = JSON.parse(e.newValue || '[]');
  }
});

window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Escape' || e.key === 'b' || e.key === 'B') {
    window.location.href = 'index.html';
  }
});

const MAIL_KINDS = ['env', 'at', 'plane'];
const mailField = [];
for (let i = 0; i < 36; i++) {
  mailField.push({
    x: Math.random(),
    y: Math.random(),
    s: Math.random() * 0.7 + 0.8,
    sp: Math.random() * 0.2 + 0.05,
    rot: (Math.random() - 0.5) * 0.6,
    kind: MAIL_KINDS[Math.floor(Math.random() * MAIL_KINDS.length)],
    phase: Math.random() * Math.PI * 2
  });
}

function drawBgEnvelope(x, y, s, rot) {
  const w = 28 * s, h = 18 * s;
  X.save();
  X.translate(x, y);
  X.rotate(rot);
  X.strokeStyle = 'rgba(180,210,255,0.18)';
  X.lineWidth = 1.2;
  X.strokeRect(-w/2, -h/2, w, h);
  X.beginPath();
  X.moveTo(-w/2, -h/2); X.lineTo(0, h * 0.15); X.lineTo(w/2, -h/2);
  X.stroke();
  X.restore();
}

function drawBgAt(x, y, s, phase) {
  X.save();
  X.translate(x, y);
  X.fillStyle = `rgba(170,200,255,${0.12 + Math.sin(phase) * 0.05})`;
  X.font = `${Math.floor(22 * s)}px Courier New`;
  X.textAlign = 'center';
  X.fillText('@', 0, 0);
  X.restore();
}

function drawBgPlane(x, y, s, phase) {
  X.save();
  X.translate(x, y);
  X.rotate(-0.45 + Math.sin(phase) * 0.05);
  X.strokeStyle = 'rgba(190,215,255,0.22)';
  X.lineWidth = 1.3;
  X.lineJoin = 'round';
  const sz = 16 * s;
  X.beginPath();
  X.moveTo(sz, 0);
  X.lineTo(-sz, -sz * 0.5);
  X.lineTo(-sz * 0.25, 0);
  X.lineTo(-sz * 0.6, sz * 0.45);
  X.closePath();
  X.stroke();
  X.beginPath();
  X.moveTo(sz, 0);
  X.lineTo(-sz * 0.25, 0);
  X.stroke();
  X.restore();
}

function drawAirmailBorder() {
  const stripe = 10;
  for (let i = 0; i < W + H; i += stripe * 2) {
    X.fillStyle = 'rgba(210,60,80,0.10)';
    X.fillRect(i, 0, stripe, 6);
    X.fillRect(i - H, H - 6, stripe, 6);
    X.fillStyle = 'rgba(70,110,200,0.10)';
    X.fillRect(i + stripe, 0, stripe, 6);
    X.fillRect(i - H + stripe, H - 6, stripe, 6);
  }
}

function draw() {
  const grad = X.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0e1a3a');
  grad.addColorStop(1, '#1a2750');
  X.fillStyle = grad;
  X.fillRect(0, 0, W, H);

  const now = Date.now();

  X.strokeStyle = 'rgba(255,255,255,0.025)';
  X.lineWidth = 1;
  for (let y = 0; y < H; y += 24) {
    X.beginPath(); X.moveTo(0, y); X.lineTo(W, y); X.stroke();
  }

  drawAirmailBorder();

  mailField.forEach(m => {
    m.y += m.sp * 0.0004;
    if (m.y > 1.05) { m.y = -0.05; m.x = Math.random(); }
    const phase = now * 0.0008 + m.phase;
    const px = m.x * W, py = m.y * H;
    if (m.kind === 'env') drawBgEnvelope(px, py, m.s, m.rot + Math.sin(phase) * 0.05);
    else if (m.kind === 'at') drawBgAt(px, py, m.s, phase);
    else drawBgPlane(px, py, m.s, phase);
  });

  const cx = W / 2;
  const scale = Math.min(W / 800, H / 700);
  const titleSize = Math.round(48 * scale);
  const rowSize = Math.round(28 * scale);
  const subSize = Math.round(16 * scale);

  // Pulsing title
  const pulse = 0.85 + Math.sin(now * 0.003) * 0.15;
  X.save();
  X.globalAlpha = pulse;
  X.textAlign = 'center';
  X.fillStyle = '#ffcc00';
  X.font = `bold ${titleSize}px Courier New`;
  X.fillText('🏆 LEADERBOARD 🏆', cx, H * 0.12);
  X.restore();

  X.textAlign = 'center';
  X.fillStyle = '#667799';
  X.font = `${subSize}px Courier New`;
  X.fillText('SPAM INVADERS', cx, H * 0.12 + titleSize * 0.7);

  if (leaderboard.length === 0) {
    X.fillStyle = '#556677';
    X.font = `${rowSize}px Courier New`;
    X.fillText('No scores yet — go play!', cx, H * 0.5);
  } else {

  const startY = H * 0.22;
  const rowH = Math.min(rowSize * 2.2, (H * 0.7) / 10);

  const leftX = cx - 340 * scale;
  const medalX = leftX;
  const rankX = leftX + 40 * scale;
  const emailX = leftX + 100 * scale;
  const lvlX = cx + 340 * scale;
  const scoreX = lvlX - 80 * scale;

  leaderboard.forEach((entry, i) => {
    const y = startY + i * rowH;
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
    const isTop3 = i < 3;

    if (isTop3) {
      const glow = 0.04 + Math.sin(now * 0.002 + i) * 0.02;
      X.fillStyle = `rgba(255,204,0,${glow})`;
      X.beginPath();
      X.roundRect(cx - 360 * scale, y - rowSize * 0.7, 720 * scale, rowH * 0.85, 8 * scale);
      X.fill();
    }

    X.fillStyle = isTop3 ? '#ffdd66' : '#aaaacc';
    X.font = `${isTop3 ? 'bold ' : ''}${rowSize}px Courier New`;

    if (medal) {
      X.textAlign = 'center';
      X.font = `${rowSize}px Courier New`;
      X.fillText(medal, medalX + 10 * scale, y);
      X.font = `${isTop3 ? 'bold ' : ''}${rowSize}px Courier New`;
    }

    X.textAlign = 'left';
    X.fillText(`${(i + 1 + '').padStart(2)}.`, rankX, y);
    X.fillText(entry.email, emailX, y);

    X.textAlign = 'right';
    X.fillText(`${entry.score} pts`, scoreX, y);

    X.textAlign = 'right';
    X.fillText(`Lv.${entry.level}`, lvlX, y);
  });

  }

  const backPulse = 0.7 + Math.sin(now * 0.004) * 0.3;
  X.save();
  X.globalAlpha = backPulse;
  X.textAlign = 'center';
  X.fillStyle = '#88aaff';
  X.font = `${subSize}px Courier New`;
  X.fillText('[ PRESS SPACE TO RETURN ]', cx, H - subSize * 1.5);
  X.restore();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
